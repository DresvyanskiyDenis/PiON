name: checks

# The gate CONTRIBUTING.md points at: the repository invariants, the type checker
# and the test suite. Nothing here needs a model provider or a credential — every
# check reads the tracked tree only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          cache: npm

      # `--ignore-scripts` on purpose: a lifecycle script from a dependency is
      # arbitrary code execution during CI, and nothing in this tree needs one.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # NOTE: no seeding step. Ten config files are generated by the installer
      # and git-ignored, so a CI checkout has only the `*.default.json` half —
      # and the rules that read them fall back to the template on their own.
      # Verified against a bare tree: `--all` reports nothing but PC-06's
      # git-availability note. If a rule ever starts failing here for want of a
      # generated file, fix the rule's fallback rather than copying files in;
      # a seeded CI tests a tree no user ever has.

      # 22 repository invariants: unqualified model ids, tiers bound to absent
      # providers, failover keys, secret-shaped literals, unreplaced placeholders,
      # a vendored tree whose bytes no longer match their recorded digests.
      # Exit 1 = the repository is wrong. Exit 2 = the checker could not run.
      # PC-19 needs the network and is skipped unless `--live` is passed.
      - name: Repository invariants
        run: ./bin/pi-check --all

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test
