# Material for MkDocs configuration.
# Checked against mkdocs 1.6.1 / mkdocs-material 9.7.7 / pymdown-extensions 11.0.1.

site_name: PiON
site_description: >-
  PiON — a hardened, portable harness for the PI coding agent: multi-provider
  routing by semantic tier, sub-agents, background jobs, worktrees, declarative
  hooks, MCP behind a default-deny trust gate, and a fail-closed headless wrapper.
site_url: https://dresvyanskiydenis.github.io/PiON/
repo_url: https://github.com/DresvyanskiyDenis/PiON
repo_name: DresvyanskiyDenis/PiON
edit_uri: edit/main/docs/
copyright: Documentation for PiON. PI itself is a separate project.

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DresvyanskiyDenis/PiON
      name: PiON on GitHub

# `strict` turns warnings into build failures. On its own that is less than it sounds: MkDocs
# reports several link defects at INFO, which `strict` does not see, so the build could report a
# dead link and still exit 0. A link into a heading that no longer exists shipped that way once.
# `validation.links` promotes that whole class to WARNING so `strict` can fail on it.
strict: true

validation:
  links:
    # A link to a `#heading` the target page does not have. Default: info.
    anchors: warn
    # A relative link that cannot be an internal link at all. Default: info.
    unrecognized_links: warn
    # A `/`-rooted link, which breaks under the project subpath this site is served from. Default: info.
    absolute_links: warn

