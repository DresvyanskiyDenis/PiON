# The DEFAULT gate, and the documented off-switch. `scripts/install.sh` symlinks this file over
# `~/.pi/agent/hooks.yaml` unless it is run with `--with-guardrails`, so a fresh install arms
# nothing. Switching either way is a link swap rather than a deletion:
#
#   ./scripts/install.sh --with-guardrails                            # on, and remembered
#   ln -sf ~/pi-config/config/hooks.yaml     ~/.pi/agent/hooks.yaml   # on, by hand
#   ln -sf ~/pi-config/config/hooks-off.yaml ~/.pi/agent/hooks.yaml   # off again
#
# `rules: []` is a legitimate shape, not a degraded one. `schema.ts` requires `version: 1` and an
# array; an empty array compiles to zero rules, and `index.ts` announces "hooks: 0 rule(s) loaded"
# at info level with no `degraded` flag and no `/doctor` D-09 finding.
#
# Why this file rather than one of the two obvious alternatives:
#
#   - Deleting `~/.pi/agent/hooks.yaml` reaches the same runtime state — a missing file is ENOENT,
#     which the loader treats as normal — but it leaves no trace. A machine with the guardrails
#     deliberately off becomes indistinguishable from a machine where the install never ran, which
#     is the quiet-failure class the `run`-script audit already cost us once.
#   - Corrupting the file reaches it too, and costs an `error`-level DEGRADED banner every session
#     plus a standing `/doctor` D-09 finding, which is indistinguishable from a real breakage.
#
# What this does NOT turn off: `guard`'s hard gates are a separate extension and keep running, and
# so does everything outside the hook layer. What it does NOT cost you either is durability —
# `scripts/install.sh` records which gate you chose alongside its other answers, and
# `scripts/update.sh` accepts both targets and re-points neither.
#
# See docs/extending/hooks.md, "Turning guardrails off".
version: 1
rules: []
